server:
  host: "0.0.0.0"
  port: 8765

workspace_root: "~/walkie_talkie_workspace"

# Projects Claude can work in. Each is shown (alphabetically) in the app.
workspaces:
  - name: "Sandbox"
    path: "~/walkie_talkie_workspace"
# Optional: instead of listing workspaces, load them from a projws projects.json
# projws_path: "~/path/to/projws/projects.json"

claude:
  # Leave blank to use the model your `claude` CLI is configured with.
  model: ""
  max_tokens: 8192
  max_conversation_turns: 50

stt:
  model_size: "base.en"
  language: "en"

tts:
  model: "gpt-4o-mini-tts"
  voice: "nova"
  speed: 1.15
  instructions: ""

audio:
  sample_rate: 16000
  channels: 1
  chunk_duration_ms: 100

vad:
  threshold: 0.5
  min_speech_duration_ms: 250
  min_silence_duration_ms: 800

safety:
  # Tools that pause and ask for approval on the phone before running.
  # Everything else auto-runs. Approve/deny by tap or by saying "yes"/"no".
  require_approval:
    - "Bash"
  # Seconds to wait for an approval before auto-denying.
  approval_timeout: 35
